[project]
name = "navisworks-viewpoints-mcp"
version = "0.1.0"
description = "MCP-сервер для работы с XML точек обзора Navisworks (nw-exchange): merge, перенос, синхронизация списков, аудит."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mikhalchankasm" }]
keywords = ["navisworks", "viewpoints", "mcp", "nw-exchange", "xml"]
dependencies = [
    "mcp[cli]>=1.2",
]

[project.scripts]
navisworks-viewpoints-mcp = "navisworks_viewpoints_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navisworks_viewpoints_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
